[platformio]
core_dir = .pio-core
build_dir = .pio/build
src_dir = tests/simavr

[env:timing]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
build_src_filter =
  -<*>
  +<timing_firmware.cpp>
  +<simavr_metadata.c>
platform_packages =
  platformio/tool-simavr@1.10800.0
build_flags =
  -Wall
  -Werror=parentheses
  -Werror=unused-variable
  -I.pio-core/packages/tool-simavr/include/simavr/avr
  -Wl,-u,_mmcu
