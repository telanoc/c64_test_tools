[platformio]
core_dir = .pio-core
build_dir = .pio/build
src_dir = c64_dram_test_mega2560

[env:mega2560]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
build_flags =
  -Wall
  -Werror=parentheses
  -Werror=unused-variable

[env:mega2560-testing]
extends = env:mega2560
build_flags =
  ${env:mega2560.build_flags}
  -DDO_TESTING
